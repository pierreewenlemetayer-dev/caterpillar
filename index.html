<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Chenille — le jeu</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap" rel="stylesheet"><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#263d30;background:#fff;font-synthesis:none}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}button,select{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{cursor:default;opacity:.46}.app{height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;gap:clamp(5px,1.1dvh,12px);padding:clamp(6px,1.4dvh,16px) 10px max(6px,env(safe-area-inset-bottom));overflow:hidden}.top{width:100%;max-width:780px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0}h1{font-size:clamp(19px,3dvh,28px);color:#287c47;margin:0}.subtitle{font-size:11px;color:#647769}.settings{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 12px;flex-shrink:0;font-size:clamp(12px,1.8dvh,15px)}.settings label{display:inline-flex;gap:5px;align-items:center}.settings select{border:1px solid #cbd6e3;background:white;color:#263d30;border-radius:7px;padding:5px}.settings input{accent-color:#287c47}.status{width:100%;display:flex;align-items:center;justify-content:space-between;font-weight:bold;font-size:clamp(13px,2.2dvh,17px);flex-shrink:0}.play-area{min-height:0;min-width:0;flex:1;width:100%;display:flex;align-items:center;justify-content:center}.game-shell{width:min(100%,calc((100dvh - 235px)*4/3),720px);max-height:100%;aspect-ratio:4/3;position:relative;border:2px solid #b5cdbb;border-radius:7px;overflow:hidden;background:#f7fafc}canvas{display:block;width:100%;height:100%}.overlay{position:absolute;inset:0;background:#ffffffc9;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;font-weight:bold;font-size:clamp(17px,3dvh,25px);color:#287c47}.overlay[hidden]{display:none}.controls{width:100%;flex-shrink:0;display:flex;flex-direction:column;gap:7px}.start{align-self:center;width:min(56%,230px);min-height:clamp(36px,6dvh,52px);border:0;border-radius:9px;background:#287c47;color:white;font-weight:bold}.arrows{display:grid;grid-template-columns:1fr 1fr;gap:9px}.turn{min-height:clamp(54px,10dvh,88px);border:1px solid #b5d0bc;border-radius:10px;background:#eaf5ed;color:#287c47;font-size:clamp(29px,5dvh,42px);font-weight:bold;user-select:none;-webkit-user-select:none}.turn:active{background:#cde9d5}.hint{font-size:11px;text-align:center;color:#647769;flex-shrink:0}.portrait-warning{display:none}@media(max-width:600px){.app{gap:5px;padding:5px 7px max(5px,env(safe-area-inset-bottom))}.subtitle{display:none}.settings{gap:4px 9px}.hint{font-size:10px}.game-shell{width:min(100%,calc((100dvh - 205px)*4/3))}}@media(max-width:600px) and (orientation:landscape){.app{display:none}.portrait-warning{display:flex;position:fixed;inset:0;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:20px;color:#287c47;background:#fff}}@media(max-height:530px) and (min-width:601px){.app{gap:3px;padding:3px}.hint{display:none}.settings select{padding:2px}.game-shell{width:min(100%,calc((100dvh - 155px)*4/3),720px)}.turn{min-height:35px}.start{min-height:28px}}@media(max-height:450px) and (max-width:600px) and (orientation:portrait){.hint{display:none}.game-shell{width:min(100%,calc((100dvh - 175px)*4/3))}.turn{min-height:42px}.start{min-height:30px}}
 .modes{display:flex;gap:5px;width:100%;justify-content:center}.modes button{border:1px solid #b9d1bf;background:#f4faf5;color:#287c47;padding:7px 11px;border-radius:8px;font-size:clamp(11px,1.8dvh,14px);font-weight:bold}.modes button.selected{background:#287c47;color:white;border-color:#287c47}.modes button:disabled{opacity:1}.status{width:min(100%,720px);font-size:clamp(17px,2.7dvh,22px);padding:0 3px}.hearts{color:#d52f3d;font-size:clamp(23px,3.8dvh,30px);letter-spacing:2px}.game-shell{border-color:#b5d0bc}.settings{width:100%}h1{color:#287c47}.overlay{color:#287c47}.start{background:#287c47}@media(max-width:600px){.modes button{padding:6px 8px}.game-shell{width:min(100%,calc((100dvh - 235px)*4/3))}}@media(max-height:450px) and (max-width:600px) and (orientation:portrait){.game-shell{width:min(100%,calc((100dvh - 195px)*4/3))}}  .top{justify-content:center;max-width:720px;text-align:center}.brand{display:flex;flex-direction:column;align-items:center;gap:0}h1{font-family:"Fredoka",Arial,Helvetica,sans-serif;font-size:clamp(28px,4.4dvh,42px);font-weight:700;line-height:1.05;letter-spacing:-.025em}.subtitle{display:block!important;font-family:Arial,Helvetica,sans-serif;font-size:clamp(12px,1.9dvh,16px);line-height:1.15;color:#66776a}.play-area{display:flex;flex-direction:column;align-items:center;justify-content:center}.board-stack{width:min(100%,calc((100dvh - 265px)*4/3),720px);max-height:100%;display:flex;flex-direction:column;align-items:stretch;gap:4px}.board-stack .status{width:100%;padding:0 3px;flex-shrink:0}.board-stack .game-shell{width:100%;min-height:0;flex-shrink:1;aspect-ratio:4/3}.settings label[hidden]{display:none}.start:disabled{opacity:.46}@media(max-width:600px){.board-stack{width:min(100%,calc((100dvh - 265px)*4/3))}}@media(max-height:530px) and (min-width:601px){.board-stack{width:min(100%,calc((100dvh - 195px)*4/3),720px)}}@media(max-height:450px) and (max-width:600px) and (orientation:portrait){.board-stack{width:min(100%,calc((100dvh - 225px)*4/3))}}  .timer{width:100%;text-align:center;font-size:clamp(17px,2.9dvh,24px);font-weight:700;color:#287c47;line-height:1.1}.timer[hidden]{display:none}.board-stack{gap:3px}.board-stack .status{margin:0}.board-stack .status #extra:empty{display:none} </style></head><body>
<main class="app"><header class="top"><div class="brand"><h1>Chenille</h1><span class="subtitle">le jeu</span></div></header>
<section class="settings" aria-label="Réglages"><div class="modes" role="group" aria-label="Mode de jeu"><button type="button" data-mode="chill">Chill mode</button><button type="button" data-mode="classic" class="selected" aria-pressed="true">Normal mode</button><button type="button" data-mode="speed">Speed up mode</button></div><label id="durationLabel">Durée <select id="duration"><option value="0" selected>Sans limite</option><option value="60">1 min</option><option value="120">2 min</option><option value="180">3 min</option><option value="240">4 min</option><option value="300">5 min</option></select></label><label><input id="grid" type="checkbox" checked> Grille visible</label></section>
<section class="play-area"><div class="board-stack"><div id="timer" class="timer" hidden aria-live="off">01:00</div><div class="status" aria-live="polite"><span id="score">Score : 0</span><span id="extra" class="hearts">♥ ♥ ♥</span></div><div class="game-shell"><canvas id="board" width="720" height="540" aria-label="Terrain de jeu 24 colonnes sur 18 lignes"></canvas><div id="overlay" class="overlay">Appuie sur Start pour jouer</div></div></div></section>
<div class="controls"><button id="start" class="start">Start</button><div class="arrows"><button id="left" class="turn" aria-label="Tourner à gauche">←</button><button id="right" class="turn" aria-label="Tourner à droite">→</button></div></div><div class="hint">← / → pour tourner · Entrée pour démarrer</div></main>
<div class="portrait-warning">Tournez votre téléphone en position verticale pour jouer.</div>
<script>
(()=>{'use strict';
const W=24,H=18,C=30,STEP=215;
const canvas=document.getElementById('board'),ctx=canvas.getContext('2d');
const modeButtons=[...document.querySelectorAll('[data-mode]')],durationEl=document.getElementById('duration'),durationLabel=document.getElementById('durationLabel'),timerEl=document.getElementById('timer'),gridEl=document.getElementById('grid'),scoreEl=document.getElementById('score'),extraEl=document.getElementById('extra'),overlay=document.getElementById('overlay'),startBtn=document.getElementById('start');
let mode='classic',applesEaten=0,snake=[],direction=0,apple=null,score=0,lives=3,remaining=60000,playing=false,paused=false,finished=false,turns=[],last=0,accum=0,raf=0;
const vectors=[[1,0],[0,1],[-1,0],[0,-1]];
const same=(a,b)=>a.x===b.x&&a.y===b.y;
const key=p=>p.x+','+p.y;
function freshSnake(){snake=[{x:12,y:9},{x:11,y:9},{x:10,y:9}];direction=0;turns=[];apple=null;spawnApple();}
function spawnApple(){const used=new Set(snake.map(key)),free=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(!used.has(x+','+y))free.push({x,y});apple=free.length?free[Math.floor(Math.random()*free.length)]:null;}
function display(){scoreEl.textContent='Score : '+score;extraEl.classList.toggle('hearts',mode!=='chill');extraEl.textContent=mode!=='chill'?'♥ '.repeat(lives).trim():'';const timed=Number(durationEl.value)>0;timerEl.hidden=!timed;if(timed){const secs=Math.ceil(remaining/1000);timerEl.textContent=String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0');}startBtn.disabled=false;startBtn.textContent=playing?'Pause':paused?'Reprendre':finished?'Rejouer':'Start';modeButtons.forEach(b=>{b.disabled=playing||paused;b.classList.toggle('selected',b.dataset.mode===mode);b.setAttribute('aria-pressed',String(b.dataset.mode===mode));});durationEl.disabled=playing||paused;}
function message(s){overlay.textContent=s;overlay.hidden=!s;}
function reset(){cancelAnimationFrame(raf);playing=false;paused=false;finished=false;score=0;applesEaten=0;lives=3;startBtn.textContent='Start';remaining=Number(durationEl.value)*1000;accum=0;freshSnake();message('Appuie sur Start pour jouer');display();draw();}
function start(){if(playing){playing=false;paused=true;cancelAnimationFrame(raf);message('Pause');display();return;}if(finished)reset();playing=true;paused=false;message('');last=performance.now();display();raf=requestAnimationFrame(frame);}
function lose(){lives--;playing=false;paused=false;cancelAnimationFrame(raf);if(lives<=0){finished=true;message('Game Over — Score : '+score);startBtn.textContent='Rejouer';}else{freshSnake();message('Vie perdue — Appuie sur Start');startBtn.textContent='Start';}display();draw();}
function queueTurn(sign){if(!playing)return;if(turns.length<2)turns.push(sign);}
function tick(){if(turns.length)direction=(direction+turns.shift()+4)%4;const v=vectors[direction],head=snake[0];let next={x:head.x+v[0],y:head.y+v[1]};if(mode==='chill'){next.x=(next.x+W)%W;next.y=(next.y+H)%H;}else if(next.x<0||next.x>=W||next.y<0||next.y>=H){lose();return;}
const eating=apple&&same(next,apple);
const occupied=snake.slice(0,eating&&mode!=='chill'?snake.length:snake.length-1);
if(occupied.some(p=>same(p,next))){lose();return;}
snake.unshift(next);if(!eating||mode==='chill')snake.pop();if(eating){score+=10;applesEaten++;spawnApple();if(!apple&&mode!=='chill'){playing=false;finished=true;message('Bravo ! Terrain rempli');startBtn.textContent='Rejouer';}}display();}
function frame(now){if(!playing)return;const delta=Math.min(100,now-last);last=now;if(Number(durationEl.value)>0){remaining=Math.max(0,remaining-delta);if(remaining===0){playing=false;finished=true;message('Temps écoulé — Score : '+score);startBtn.textContent='Rejouer';display();draw();return;}}
accum+=delta;const interval=mode==='speed'?Math.max(95,STEP-Math.floor(applesEaten/3)*9):STEP;if(accum>=interval){accum-=interval;tick();}draw();if(playing)raf=requestAnimationFrame(frame);}
function draw(){ctx.clearRect(0,0,720,540);ctx.fillStyle='#f7fafc';ctx.fillRect(0,0,720,540);if(gridEl.checked){ctx.strokeStyle='#e1e8f0';ctx.lineWidth=1;ctx.beginPath();for(let x=1;x<W;x++){ctx.moveTo(x*C+.5,0);ctx.lineTo(x*C+.5,540);}for(let y=1;y<H;y++){ctx.moveTo(0,y*C+.5);ctx.lineTo(720,y*C+.5);}ctx.stroke();}
if(apple){const x=apple.x*C+C/2,y=apple.y*C+C/2;ctx.fillStyle='#d93838';ctx.beginPath();ctx.arc(x,y,10,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#39834d';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,y-9);ctx.quadraticCurveTo(x+3,y-15,x+8,y-13);ctx.stroke();}
snake.forEach((p,i)=>{ctx.fillStyle=i===0?'#238a4c':'#51ae6d';ctx.beginPath();ctx.roundRect(p.x*C+2,p.y*C+2,C-4,C-4,5);ctx.fill();});if(snake.length){const h=snake[0],v=vectors[direction],px=h.x*C+15,py=h.y*C+15;ctx.fillStyle='#fff';if(v[0]!==0){ctx.beginPath();ctx.arc(px+v[0]*7,py-5,2.5,0,7);ctx.arc(px+v[0]*7,py+5,2.5,0,7);ctx.fill();}else{ctx.beginPath();ctx.arc(px-5,py+v[1]*7,2.5,0,7);ctx.arc(px+5,py+v[1]*7,2.5,0,7);ctx.fill();}}}
document.getElementById('left').addEventListener('pointerdown',e=>{e.preventDefault();queueTurn(-1);});document.getElementById('right').addEventListener('pointerdown',e=>{e.preventDefault();queueTurn(1);});
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();if(!e.repeat)queueTurn(e.key==='ArrowLeft'?-1:1);}else if(e.key==='Enter'&&document.activeElement.tagName!=='SELECT'){e.preventDefault();if(!e.repeat)start();}});
startBtn.addEventListener('click',start);modeButtons.forEach(b=>b.addEventListener('click',()=>{if(playing||paused)return;mode=b.dataset.mode;durationEl.value=mode==='chill'?'60':'0';durationLabel.hidden=false;gridEl.checked=mode==='chill';reset();}));durationEl.addEventListener('change',reset);gridEl.addEventListener('change',draw);
gridEl.checked=false;durationEl.value='0';
reset();
})();
</script></body></html>

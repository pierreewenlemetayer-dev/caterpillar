<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Caterpillar — Jeu du serpent</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#24334b;background:#fff;font-synthesis:none}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}button,select{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{cursor:default;opacity:.46}.app{height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;gap:clamp(5px,1.1dvh,12px);padding:clamp(6px,1.4dvh,16px) 10px max(6px,env(safe-area-inset-bottom));overflow:hidden}.top{width:100%;max-width:780px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0}h1{font-size:clamp(19px,3dvh,28px);color:#2452a2;margin:0}.subtitle{font-size:11px;color:#66758a}.settings{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 12px;flex-shrink:0;font-size:clamp(12px,1.8dvh,15px)}.settings label{display:inline-flex;gap:5px;align-items:center}.settings select{border:1px solid #cbd6e3;background:white;color:#24334b;border-radius:7px;padding:5px}.settings input{accent-color:#2452a2}.status{width:100%;display:flex;align-items:center;justify-content:space-between;font-weight:bold;font-size:clamp(13px,2.2dvh,17px);flex-shrink:0}.play-area{min-height:0;min-width:0;flex:1;width:100%;display:flex;align-items:center;justify-content:center}.game-shell{width:min(100%,calc((100dvh - 235px)*4/3),720px);max-height:100%;aspect-ratio:4/3;position:relative;border:2px solid #aebdce;border-radius:7px;overflow:hidden;background:#f7fafc}canvas{display:block;width:100%;height:100%}.overlay{position:absolute;inset:0;background:#ffffffc9;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;font-weight:bold;font-size:clamp(17px,3dvh,25px);color:#2452a2}.overlay[hidden]{display:none}.controls{width:100%;flex-shrink:0;display:flex;flex-direction:column;gap:7px}.start{align-self:center;width:min(56%,230px);min-height:clamp(36px,6dvh,52px);border:0;border-radius:9px;background:#2452a2;color:white;font-weight:bold}.arrows{display:grid;grid-template-columns:1fr 1fr;gap:9px}.turn{min-height:clamp(54px,10dvh,88px);border:1px solid #b5c8df;border-radius:10px;background:#e9f1fb;color:#2452a2;font-size:clamp(29px,5dvh,42px);font-weight:bold;user-select:none;-webkit-user-select:none}.turn:active{background:#c8ddf7}.hint{font-size:11px;text-align:center;color:#6b7889;flex-shrink:0}.portrait-warning{display:none}@media(max-width:600px){.app{gap:5px;padding:5px 7px max(5px,env(safe-area-inset-bottom))}.subtitle{display:none}.settings{gap:4px 9px}.hint{font-size:10px}.game-shell{width:min(100%,calc((100dvh - 205px)*4/3))}}@media(max-width:600px) and (orientation:landscape){.app{display:none}.portrait-warning{display:flex;position:fixed;inset:0;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:20px;color:#2452a2;background:#fff}}@media(max-height:530px) and (min-width:601px){.app{gap:3px;padding:3px}.hint{display:none}.settings select{padding:2px}.game-shell{width:min(100%,calc((100dvh - 155px)*4/3),720px)}.turn{min-height:35px}.start{min-height:28px}}@media(max-height:450px) and (max-width:600px) and (orientation:portrait){.hint{display:none}.game-shell{width:min(100%,calc((100dvh - 175px)*4/3))}.turn{min-height:42px}.start{min-height:30px}}
</style></head><body>
<main class="app"><header class="top"><div><h1>Caterpillar</h1><span class="subtitle">Le jeu du serpent</span></div><span class="subtitle">© 2026</span></header>
<section class="settings" aria-label="Réglages"><label>Mode <select id="mode"><option value="classic">Classique</option><option value="chill">Chill</option></select></label><label id="durationLabel" hidden>Durée <select id="duration"><option value="60">1 min</option><option value="120">2 min</option><option value="180" selected>3 min</option><option value="240">4 min</option><option value="300">5 min</option></select></label><label><input id="grid" type="checkbox" checked> Grille visible</label></section>
<div class="status" aria-live="polite"><span id="score">Score : 0</span><span id="extra">♥ ♥ ♥</span></div>
<section class="play-area"><div class="game-shell"><canvas id="board" width="720" height="540" aria-label="Terrain de jeu 24 colonnes sur 18 lignes"></canvas><div id="overlay" class="overlay">Appuie sur Start pour jouer</div></div></section>
<div class="controls"><button id="start" class="start">Start</button><div class="arrows"><button id="left" class="turn" aria-label="Tourner à gauche">←</button><button id="right" class="turn" aria-label="Tourner à droite">→</button></div></div><div class="hint">← / → pour tourner · Entrée pour démarrer</div></main>
<div class="portrait-warning">Tournez votre téléphone en position verticale pour jouer.</div>
<script>
(()=>{'use strict';
const W=24,H=18,C=30,STEP=160;
const canvas=document.getElementById('board'),ctx=canvas.getContext('2d');
const modeEl=document.getElementById('mode'),durationEl=document.getElementById('duration'),durationLabel=document.getElementById('durationLabel'),gridEl=document.getElementById('grid'),scoreEl=document.getElementById('score'),extraEl=document.getElementById('extra'),overlay=document.getElementById('overlay'),startBtn=document.getElementById('start');
let mode='classic',snake=[],direction=0,apple=null,score=0,lives=3,remaining=180000,playing=false,finished=false,turns=[],last=0,accum=0,raf=0;
const vectors=[[1,0],[0,1],[-1,0],[0,-1]];
const same=(a,b)=>a.x===b.x&&a.y===b.y;
const key=p=>p.x+','+p.y;
function freshSnake(){snake=[{x:12,y:9},{x:11,y:9},{x:10,y:9}];direction=0;turns=[];apple=null;spawnApple();}
function spawnApple(){const used=new Set(snake.map(key)),free=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(!used.has(x+','+y))free.push({x,y});apple=free.length?free[Math.floor(Math.random()*free.length)]:null;}
function display(){scoreEl.textContent='Score : '+score;extraEl.textContent=mode==='classic'?'♥ '.repeat(lives).trim():Math.ceil(remaining/1000/60).toString().padStart(2,'0')+':'+(Math.ceil(remaining/1000)%60).toString().padStart(2,'0');startBtn.disabled=playing;modeEl.disabled=playing;durationEl.disabled=playing;}
function message(s){overlay.textContent=s;overlay.hidden=!s;}
function reset(){cancelAnimationFrame(raf);playing=false;finished=false;score=0;lives=3;remaining=Number(durationEl.value)*1000;accum=0;freshSnake();message('Appuie sur Start pour jouer');display();draw();}
function start(){if(playing)return;if(finished){reset();}playing=true;message('');last=performance.now();accum=0;display();raf=requestAnimationFrame(frame);}
function lose(){lives--;playing=false;cancelAnimationFrame(raf);if(lives<=0){finished=true;message('Game Over — Score : '+score);startBtn.textContent='Rejouer';}else{freshSnake();message('Vie perdue — Appuie sur Start');startBtn.textContent='Start';}display();draw();}
function queueTurn(sign){if(!playing)return;if(turns.length<2)turns.push(sign);}
function tick(){if(turns.length)direction=(direction+turns.shift()+4)%4;const v=vectors[direction],head=snake[0];let next={x:head.x+v[0],y:head.y+v[1]};if(mode==='chill'){next.x=(next.x+W)%W;next.y=(next.y+H)%H;}else if(next.x<0||next.x>=W||next.y<0||next.y>=H){lose();return;}
const eating=apple&&same(next,apple);
const occupied=snake.slice(0,eating&&mode==='classic'?snake.length:snake.length-1);
if(occupied.some(p=>same(p,next))){lose();return;}
snake.unshift(next);if(!eating||mode==='chill')snake.pop();if(eating){score+=10;spawnApple();if(!apple&&mode==='classic'){playing=false;finished=true;message('Bravo ! Terrain rempli');startBtn.textContent='Rejouer';}}display();}
function frame(now){if(!playing)return;const delta=Math.min(100,now-last);last=now;if(mode==='chill'){remaining=Math.max(0,remaining-delta);if(remaining===0){playing=false;finished=true;message('Temps écoulé — Score : '+score);startBtn.textContent='Rejouer';display();draw();return;}}
accum+=delta;if(accum>=STEP){accum-=STEP;tick();}draw();if(playing)raf=requestAnimationFrame(frame);}
function draw(){ctx.clearRect(0,0,720,540);ctx.fillStyle='#f7fafc';ctx.fillRect(0,0,720,540);if(gridEl.checked){ctx.strokeStyle='#e1e8f0';ctx.lineWidth=1;ctx.beginPath();for(let x=1;x<W;x++){ctx.moveTo(x*C+.5,0);ctx.lineTo(x*C+.5,540);}for(let y=1;y<H;y++){ctx.moveTo(0,y*C+.5);ctx.lineTo(720,y*C+.5);}ctx.stroke();}
if(apple){const x=apple.x*C+C/2,y=apple.y*C+C/2;ctx.fillStyle='#d93838';ctx.beginPath();ctx.arc(x,y,10,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#39834d';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,y-9);ctx.quadraticCurveTo(x+3,y-15,x+8,y-13);ctx.stroke();}
snake.forEach((p,i)=>{ctx.fillStyle=i===0?'#238a4c':'#51ae6d';ctx.beginPath();ctx.roundRect(p.x*C+2,p.y*C+2,C-4,C-4,5);ctx.fill();});if(snake.length){const h=snake[0],v=vectors[direction],px=h.x*C+15,py=h.y*C+15;ctx.fillStyle='#fff';if(v[0]!==0){ctx.beginPath();ctx.arc(px+v[0]*7,py-5,2.5,0,7);ctx.arc(px+v[0]*7,py+5,2.5,0,7);ctx.fill();}else{ctx.beginPath();ctx.arc(px-5,py+v[1]*7,2.5,0,7);ctx.arc(px+5,py+v[1]*7,2.5,0,7);ctx.fill();}}}
document.getElementById('left').addEventListener('pointerdown',e=>{e.preventDefault();queueTurn(-1);});document.getElementById('right').addEventListener('pointerdown',e=>{e.preventDefault();queueTurn(1);});
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();if(!e.repeat)queueTurn(e.key==='ArrowLeft'?-1:1);}else if(e.key==='Enter'&&document.activeElement.tagName!=='SELECT'){e.preventDefault();if(!e.repeat)start();}});
startBtn.addEventListener('click',start);modeEl.addEventListener('change',()=>{mode=modeEl.value;durationLabel.hidden=mode!=='chill';reset();});durationEl.addEventListener('change',reset);gridEl.addEventListener('change',draw);
try{const saved=localStorage.getItem('caterpillar-grid');if(saved!==null)gridEl.checked=saved==='true';gridEl.addEventListener('change',()=>localStorage.setItem('caterpillar-grid',String(gridEl.checked)));}catch{}
reset();
})();
</script></body></html>
